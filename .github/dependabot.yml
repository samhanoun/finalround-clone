# Dependabot version updates (security updates are a repository setting: see
# docs/ci.md). Weekly, on Mondays; minor and patch updates come grouped into
# one pull request per ecosystem and dependency type, majors one by one.
#
# cooldown holds a new release back for a week before Dependabot proposes it,
# so a compromised or broken publish has time to be caught and yanked.
# Security updates ignore the cooldown.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Released together and pinned to the same version in package.json.
      nextjs:
        patterns:
          - next
          - eslint-config-next
          - '@next/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Same monorepo and release train.
      electron-builder:
        patterns:
          - electron-builder
          - electron-updater
      desktop-minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflow actions are pinned to commit SHAs with the version in a comment;
  # Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
