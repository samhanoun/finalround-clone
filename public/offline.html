<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1324">
  <title>Offline · Apex Round</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --midnight: #0b1324;
      --deck: #111b30;
      --deck-2: #17233d;
      --line: #243250;
      --paper: #e8edf7;
      --mist: #93a1bf;
      --ember: #ffb547;
      --live: #45d49b;
      --alert: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--midnight);
      color: var(--paper);
      font: 16px/1.6 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .panel {
      width: min(440px, 100%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 28px 30px;
      border-radius: 18px;
      background: var(--deck);
      border: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0;
      color: var(--mist);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--deck-2);
      color: var(--paper);
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .primary {
      border-color: var(--ember);
      background: var(--ember);
      color: var(--midnight);
    }

    .button:focus-visible {
      outline: 2px solid var(--ember);
      outline-offset: 3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--mist);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--alert);
    }

    .dot.online {
      background: var(--live);
    }
  </style>
</head>
<body>
  <main class="panel">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <rect x="1" y="1" width="42" height="42" rx="12" fill="#111B30" stroke="#2C3B5E"/>
      <path d="M11 30 L22 12 L33 30" fill="none" stroke="#E8EDF7" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M14.5 27 h4.5 l2 -4.2 l3 7.2 l2 -3 h4" fill="none" stroke="#FFB547" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>You're offline</h1>
    <p>Apex Round needs a connection to hear the interviewer and write answers. Reconnect, then try again.</p>

    <div class="actions">
      <button class="button primary" id="retry" type="button">Try again</button>
      <a class="button" href="/">Go to the home page</a>
    </div>

    <p class="status" role="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Checking your connection…</span>
    </p>
  </main>

  <script>
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const retry = document.getElementById('retry');

    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusDot.classList.add('online');
        statusText.textContent = 'Back online. Reloading…';
        setTimeout(() => window.location.reload(), 1500);
      } else {
        statusDot.classList.remove('online');
        statusText.textContent = 'No internet connection.';
      }
    }

    retry.addEventListener('click', () => {
      retry.textContent = 'Trying…';
      retry.disabled = true;
      fetch('/api/health', { method: 'HEAD', cache: 'no-store' })
        .then(() => window.location.reload())
        .catch(() => {
          retry.textContent = 'Try again';
          retry.disabled = false;
          statusText.textContent = 'Still offline. Check your connection.';
        });
    });

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
